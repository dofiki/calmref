name: CI

on: 
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs: 
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .Net
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore calmref_server/calmref.Api/calmref.Api.csproj

    - name: Build Solution
      run: dotnet build calmref_server/calmref.Api/calmref.Api.csproj --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test calmref_server/calmref.Api/calmref.Api.csproj --no-build --configuration Release